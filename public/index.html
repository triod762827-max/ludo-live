<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b0f3b">
<title>Ludo Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b0f3b;--card:#2a1a57;--line:#4a3590;--fg:#fff;--mut:#b9aee6;--t:30deg}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--fg);font:500 16px/1.35 "Baloo 2","Trebuchet MS",system-ui,sans-serif;background:radial-gradient(90% 60% at 50% 0,#4b2aa8,var(--bg) 70%) fixed;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:520px;margin:0 auto;padding:10px 12px 24px}
h1{font-size:44px;font-weight:800;margin:14px 0 0;line-height:1;background:linear-gradient(90deg,#ff6b6f,#ffd95a,#5fe08f,#6aa6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.mut{color:var(--mut);font-size:14px}.err{color:#ff9a9a;min-height:22px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;margin:10px 0;box-shadow:0 6px 0 #150b30}
input{width:100%;padding:11px 14px;border-radius:14px;border:2px solid var(--line);background:#160c33;color:#fff;font:inherit;margin:4px 0;outline:0}
input:focus{border-color:#ffd95a}
button{font:inherit;font-weight:800;padding:9px 16px;border:0;border-radius:14px;background:linear-gradient(#5b9bff,#2f6fe0);color:#fff;box-shadow:0 4px 0 #1b3f8f;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #1b3f8f}button.alt{background:linear-gradient(#6a58b8,#4a3590);box-shadow:0 4px 0 #2c1f63}
button.go{background:linear-gradient(#52d98a,#22a85a);box-shadow:0 4px 0 #136b37}button:disabled{opacity:.4}button.on{outline:3px solid #ffd95a}
.row{display:flex;gap:8px;align-items:center}.grow{flex:1;min-width:0}
.code{font-size:26px;letter-spacing:4px;font-weight:800;color:#ffd95a}
.pbar{display:flex;gap:6px;justify-content:space-between;margin:8px 0}
.pc{flex:1;text-align:center;min-width:0;transition:.3s}.pc.off{opacity:.55}.pc.dn{filter:saturate(.6)}
.av{position:relative;width:54px;height:54px;margin:0 auto;border-radius:50%;padding:4px;background:conic-gradient(var(--c) var(--p,360deg),#ffffff25 0);transition:transform .3s}
.av span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#160c33;font-size:26px}
.pc.on .av{transform:scale(1.15);box-shadow:0 0 18px var(--c)}
.pc.on .av::after{content:attr(data-t);position:absolute;right:-6px;bottom:-4px;background:#000c;border-radius:99px;font-size:12px;padding:0 6px}
.pc .nm{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rk{font-size:18px}
.wrap{position:relative}
.stage{perspective:900px;perspective-origin:50% 0;margin:-3% 0 -2%}
.board{position:relative;transform:rotateX(var(--t));transform-style:preserve-3d;border-radius:16px;box-shadow:0 40px 40px #0009;transition:transform .6s}
.board::before{content:"";position:absolute;inset:0;border-radius:16px;background:#4a2a10;transform:translateZ(-18px)}
.board svg{display:block;width:100%;border-radius:16px;border:6px solid #a9692f}
.yh{opacity:0}.yh.on{opacity:1;animation:pl .9s infinite alternate}@keyframes pl{to{opacity:.25}}
.pw{position:absolute;width:6.8%;aspect-ratio:1/1.6;transform-origin:50% 100%;transform:translate(-50%,-100%) rotateX(calc(var(--t)*-1));transition:left .17s linear,top .17s linear;pointer-events:none}
.pw .in{position:absolute;inset:0}.pw.hop .in{animation:hop .2s}
.pw .sh{position:absolute;left:-18%;right:-18%;bottom:-6%;height:22%;border-radius:50%;background:radial-gradient(#000a,#0000 70%)}
.pw .bd{position:absolute;left:6%;right:6%;bottom:4%;height:60%;clip-path:polygon(32% 0,68% 0,100% 100%,0 100%);background:linear-gradient(90deg,#ffffff66,var(--c) 35%,#0007)}
.pw .hd{position:absolute;left:14%;right:14%;top:0;aspect-ratio:1;border-radius:50%;border:3px solid #fff;background:radial-gradient(circle at 35% 30%,#fffc,var(--c) 45%,#0008)}
.pw.mv{pointer-events:auto;cursor:pointer}.pw.mv .hd{animation:bob .5s infinite alternate;box-shadow:0 0 0 3px #ffd95a,0 0 16px 6px #fff}
@keyframes hop{50%{transform:translateY(-45%)}}@keyframes bob{to{transform:translateY(-16%)}}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fl{position:absolute;bottom:8%;text-align:center;animation:up 2.4s ease-out forwards;font-size:44px}
.fl small{display:block;font-size:12px;background:#000a;border-radius:8px;padding:0 6px}
@keyframes up{0%{transform:translateY(0) scale(.3);opacity:0}15%{transform:scale(1.3);opacity:1}100%{transform:translateY(-280px) rotate(12deg);opacity:0}}
.ctl{display:flex;align-items:center;gap:12px}
.dw{width:64px;height:64px;perspective:320px;flex:none;border-radius:14px}.dw.my{animation:glow .7s infinite alternate;cursor:pointer}
@keyframes glow{to{box-shadow:0 0 0 4px #ffd95a,0 0 22px #ffd95a}}
.dw.rl{animation:toss .9s}@keyframes toss{40%{transform:translateY(-34px) scale(1.2)}}
.cube{position:relative;width:64px;height:64px;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.2,.8,.3,1)}
.f{position:absolute;inset:0;background:linear-gradient(135deg,#fff,#e5e2f3);border-radius:12px;display:grid;grid:repeat(3,1fr)/repeat(3,1fr);padding:9px;box-shadow:inset 0 0 8px #0004;backface-visibility:hidden}
.f i{border-radius:50%;background:radial-gradient(circle at 35% 30%,#666,#111);margin:12%}
#ms{font-weight:800}
#log{height:140px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:2px}
.m{max-width:85%;padding:5px 12px;border-radius:14px 14px 14px 4px;background:#160c33;border-left:4px solid var(--c);animation:pop .35s cubic-bezier(.3,1.6,.5,1);align-self:flex-start;word-break:break-word}
.m.me{align-self:flex-end;border-radius:14px 14px 4px 14px;background:#3b2a80}
.m b{font-size:12px;color:var(--c);display:block;line-height:1.1}.m.big{font-size:38px;line-height:1.1;background:none}
@keyframes pop{from{transform:scale(.4) translateY(20px);opacity:0}}
#typ{height:20px;font-size:13px;color:var(--mut)}
.dots i{display:inline-block;width:5px;height:5px;margin:0 1px;border-radius:50%;background:var(--mut);animation:b2 .8s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes b2{50%{transform:translateY(-5px)}}
.pick{display:flex;flex-wrap:wrap;margin-top:8px}.pick button,.react button{background:none;box-shadow:none;padding:3px 6px;font-size:26px}
.react{display:flex;justify-content:space-between;margin-bottom:6px}.react button{background:#160c33;border-radius:99px;padding:3px 12px}
#ov{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:20;padding:16px;animation:pop .4s}
#ov .card{width:100%;max-width:360px;text-align:center}
.rankrow{display:flex;gap:10px;align-items:center;padding:8px 12px;margin:6px 0;border-radius:14px;background:#160c33;border-left:6px solid var(--c);font-size:18px;font-weight:800}
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:30;animation:fall linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.chipset{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chipset span{background:#160c33;border-radius:99px;padding:2px 10px;font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div id="app"></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COL=['#ff4d52','#2fcf78','#ffc61a','#3f86ff'],LT=['#ff8d90','#7ae8a8','#ffe07a','#8abaff'],CN=['Red','Green','Yellow','Blue'],AV=['🦊','🐸','🐯','🐬'],MED=['🥇','🥈','🥉','4️⃣'],SAFE=[0,8,13,21,26,34,39,47],TURN=20000;
const SEGS=[[1,6,1,0,5],[6,5,0,-1,6],[7,0,1,0,2],[8,1,0,1,5],[9,6,1,0,6],[14,7,0,1,2],[13,8,-1,0,5],[8,9,0,1,6],[7,14,-1,0,2],[6,13,0,-1,5],[5,8,-1,0,6],[0,7,0,-1,2]];
const PATH=[];SEGS.forEach(([x,y,dx,dy,n])=>{for(let k=0;k<n;k++)PATH.push([x+dx*k,y+dy*k])});
const HOME=[[1,2,3,4,5].map(i=>[i,7]),[1,2,3,4,5].map(i=>[7,i]),[13,12,11,10,9].map(i=>[i,7]),[13,12,11,10,9].map(i=>[7,i])];
const YO=[[0,0],[9,0],[9,9],[0,9]],SLX=[2,4,2,4],SLY=[2,2,4,4],FIN=[[-.6,0],[0,-.6],[.6,0],[0,.6]];
const EMO='😀😂🤣😍😎🤔😡😭😱🥳👍👏🙏🔥🎉🎲🏆💀🙈😴🤝💪❤️✨'.match(/\p{Extended_Pictographic}\uFE0F?/gu);
let cid;try{cid=localStorage.cid||(localStorage.cid=Math.random().toString(36).slice(2,12))}catch(e){cid=Math.random().toString(36).slice(2,12)}
let ws,S=null,you=null,ON=[],off=0,code='',name='',view='home',err='',create=false,pawns={},built=false,typT,lastTyp=0,lastRoll=-1,lastKey='',lastTick=-1,doneShown=false,muted=false,rot=0,flat=false;
try{muted=localStorage.mute==='1'}catch(e){}
const pos=(s,p,i)=>p<0?[YO[s][0]+SLX[i],YO[s][1]+SLY[i]]:p<=50?PATH[(s*13+p)%52].map(v=>v+.5):p<=55?HOME[s][p-51].map(v=>v+.5):[7.5+FIN[s][0],7.5+FIN[s][1]];
const legal=(s,d)=>S.tk[s].map((p,i)=>(p<0?d==6:p+d<=56)?i:-1).filter(i=>i>=0);
const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};

// ---------- sound (synthesised, no files) ----------
let AC;const au=()=>{if(!AC)try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}if(AC&&AC.state==='suspended')AC.resume();return AC};
document.addEventListener('pointerdown',au);
function tone(f,t=0,d=.12,ty='sine',v=.15,f2){const a=au();if(!a||muted)return;const o=a.createOscillator(),g=a.createGain(),s=a.currentTime+t;o.type=ty;o.frequency.setValueAtTime(f,s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d+.02)}
const SFX={roll(){for(let k=0;k<10;k++)tone(250+Math.random()*500,k*.085,.05,'square',.05)},step(){tone(560,0,.08,'triangle',.2,380)},out(){tone(380,0,.12,'triangle',.22,900)},
 cap(){tone(520,0,.4,'sawtooth',.16,70);tone(110,0,.3,'square',.1)},home(){[523,659,784,1047].forEach((f,k)=>tone(f,k*.1,.25,'triangle',.2))},six(){[784,988,1175].forEach((f,k)=>tone(f,k*.07,.15,'sine',.15))},
 ping(){tone(880,0,.15,'sine',.12);tone(1320,.1,.2,'sine',.1)},tick(){tone(1000,0,.04,'square',.06)},msg(){tone(700,0,.09,'sine',.1,950)},pop(){tone(300,0,.12,'sine',.2,700)},
 win(){[523,659,784,659,784,1047,1319].forEach((f,k)=>tone(f,k*.13,.3,'triangle',.2))}};

// ---------- board ----------
const PIPS=[[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]],FT=['','rotateX(90deg)','rotateY(90deg)','rotateY(-90deg)','rotateX(-90deg)','rotateY(180deg)'],ROT=[[0,0],[-90,0],[0,-90],[0,90],[90,0],[0,180]];
const CUBE=[1,2,3,4,5,6].map(v=>`<div class="f" style="transform:${FT[v-1]} translateZ(32px)">${[...Array(9)].map((_,k)=>PIPS[v-1].includes(k)?'<i></i>':'<b></b>').join('')}</div>`).join('');
const BOARD=(()=>{let s='<defs>'+COL.map((c,k)=>`<linearGradient id="g${k}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${LT[k]}"/><stop offset="1" stop-color="${c}"/></linearGradient>`).join('')+'</defs><rect width="15" height="15" fill="#fffaf0"/>';
 for(let k=0;k<4;k++){const[x,y]=YO[k];s+=`<rect x="${x}" y="${y}" width="6" height="6" fill="url(#g${k})"/><rect x="${x+.9}" y="${y+.9}" width="4.2" height="4.2" rx=".8" fill="#fffaf0"/>`;
  for(let i=0;i<4;i++)s+=`<circle cx="${x+SLX[i]}" cy="${y+SLY[i]}" r=".55" fill="url(#g${k})" stroke="#fff" stroke-width=".1"/>`;
  s+=`<rect id="yh${k}" class="yh" x="${x+.05}" y="${y+.05}" width="5.9" height="5.9" fill="none" stroke="#fff" stroke-width=".25"/>`;
  HOME[k].forEach(c=>s+=`<rect x="${c[0]}" y="${c[1]}" width="1" height="1" fill="url(#g${k})" stroke="#fff" stroke-width=".06"/>`)}
 PATH.forEach((c,i)=>{const st=i%13==0;s+=`<rect x="${c[0]}" y="${c[1]}" width="1" height="1" fill="${st?`url(#g${i/13})`:'#fffaf0'}" stroke="#d8cba8" stroke-width=".06"/>`;
  if(st||SAFE.includes(i))s+=`<text x="${c[0]+.5}" y="${c[1]+.75}" font-size=".7" text-anchor="middle" fill="${st?'#fff':'#e0a91c'}">★</text>`});
 [[[6,6],[7.5,7.5],[6,9]],[[6,6],[9,6],[7.5,7.5]],[[9,6],[9,9],[7.5,7.5]],[[6,9],[9,9],[7.5,7.5]]].forEach((t,k)=>s+=`<polygon points="${t.map(p=>p.join()).join(' ')}" fill="url(#g${k})" stroke="#fff" stroke-width=".06"/>`);
 return`<svg viewBox="0 0 15 15">${s}</svg>`})();

// ---------- network ----------
function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/'+code);
 ws.onopen=()=>send({t:'join',id:cid,name,create});ws.onmessage=e=>on(JSON.parse(e.data));
 ws.onclose=()=>{if(view==='game'||view==='joining')setTimeout(()=>{create=false;connect()},1500)}}
const send=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));
function fail(m){view='home';err=m;if(ws){ws.onclose=null;ws.close()}home()}
function on(d){
 if(d.t==='nope')return fail('No room with that code. Check it with the host.');
 if(d.t==='full')return fail('That game has already started or is full.');
 if(d.t==='state'){S=d.s;you=d.you;ON=d.on;off=d.now-Date.now();if(view!=='game'){view='game';game()}update()}
 else if(d.t==='chat'){addMsg(d);if(!mineSeat(d.seat))SFX.msg()}
 else if(d.t==='emoji'){floatEmoji(d);SFX.pop()}else if(d.t==='typing')typing(d)}
const mineSeat=s=>S&&S.players.some(p=>p.id===you&&p.seat===s);
function start(mk){name=($('nm').value.trim()||(mk?'Host':'Guest')).slice(0,14);
 code=mk?Array.from({length:5},()=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.random()*31|0]).join(''):$('rc').value.trim().toUpperCase();
 if(!code)return fail('Enter a room code.');create=mk;err='';view='joining';location.hash=code;connect()}

// ---------- screens ----------
function home(){$('app').innerHTML=`<h1>Ludo Live</h1><div class="mut">Roll, race and chat with friends. No sign-up.</div>
 <div class="chipset"><span>🎲 3D dice</span><span>⭐ Safe stars</span><span>🔊 Sound</span><span>💬 Chat &amp; emoji</span><span>⏱ Turn timer</span></div>
 <div class="card"><input id="nm" maxlength="14" placeholder="Your name" value="${esc(name)}"><button id="mk" class="go" style="width:100%;margin-top:6px">Create room</button></div>
 <div class="card"><input id="rc" maxlength="5" placeholder="Room code" style="text-transform:uppercase" value="${esc(location.hash.slice(1).toUpperCase().replace(/[^A-Z0-9]/g,''))}"><button id="jn" class="alt" style="width:100%;margin-top:6px">Join room</button></div><div class="err">${esc(err)}</div>`;
 $('mk').onclick=()=>start(true);$('jn').onclick=()=>start(false)}
function game(){built=false;pawns={};lastRoll=-1;doneShown=false;
 $('app').innerHTML=`<div class="row"><div class="grow">Room <span class="code">${code}</span></div><button id="sd" class="alt">${muted?'🔇':'🔊'}</button><button id="tv" class="alt">🧊</button><button id="cp" class="alt">Link</button></div>
 <div class="pbar" id="pbar"></div>
 <div class="wrap"><div class="stage"><div class="board" id="bd">${BOARD}</div></div><div class="fx" id="fx"></div></div>
 <div class="card" id="lob"></div>
 <div class="card ctl" id="ctl"><div class="dw" id="dw"><div class="cube" id="cube">${CUBE}</div></div><div class="grow"><div id="ms"></div><div class="mut" id="sub"></div></div><button id="rl" class="go">Roll</button></div>
 <div class="card"><div class="react">${['😂','😡','👏','🔥','😭','🎉'].map(e=>`<button data-e="${e}">${e}</button>`).join('')}</div>
 <div id="log"></div><div id="typ"></div>
 <div class="row"><input id="ci" class="grow" maxlength="200" placeholder="Say something…" autocomplete="off"><button id="em" class="alt">😊</button><button id="sn">Send</button></div>
 <div class="pick" id="pk" hidden>${EMO.map(e=>`<button>${e}</button>`).join('')}</div></div><div id="ov" hidden></div>`;
 $('cp').onclick=()=>{try{navigator.clipboard.writeText(location.origin+'/#'+code)}catch(e){}$('cp').textContent='Copied!'};
 $('sd').onclick=()=>{muted=!muted;$('sd').textContent=muted?'🔇':'🔊';try{localStorage.mute=muted?1:0}catch(e){}};
 $('tv').onclick=()=>{flat=!flat;$('bd').style.setProperty('--t',flat?'0deg':'30deg')};
 $('em').onclick=()=>$('pk').hidden=!$('pk').hidden;
 $('pk').onclick=e=>{if(e.target.tagName==='BUTTON'){$('ci').value+=e.target.textContent;$('ci').focus()}};
 document.querySelector('.react').onclick=e=>{const b=e.target.closest('button');if(b)send({t:'emoji',e:b.dataset.e})};
 const say=()=>{const v=$('ci').value.trim();if(v){send({t:'chat',text:v});$('ci').value=''}};
 $('sn').onclick=say;$('ci').onkeydown=e=>{if(e.key==='Enter')say()};
 $('ci').oninput=()=>{if(Date.now()-lastTyp>1500){lastTyp=Date.now();send({t:'typing'})}};
 $('rl').onclick=$('dw').onclick=()=>{if(S&&S.ph==='play'&&S.players[S.turn].id===you&&S.dice===null)send({t:'roll'})};
 $('bd').onclick=e=>{const p=e.target.closest('.pw.mv');if(p)send({t:'move',i:+p.dataset.i})}}

// ---------- pawn movement (hops cell by cell) ----------
function place(o,xy,z){o.el.style.left=xy[0]/15*100+'%';o.el.style.top=(xy[1]+.28)/15*100+'%';o.el.style.zIndex=z}
function hop(el){el.classList.remove('hop');void el.offsetWidth;el.classList.add('hop')}
function moveTo(o,s,i,from,to){
 if(from<0||to-from>6||to<from){place(o,o.tg.xy,o.tg.z);hop(o.el);return}
 o.anim=true;let q=from;const iv=setInterval(()=>{q++;place(o,pos(s,q,i),50);hop(o.el);SFX.step();
  if(q>=to){clearInterval(iv);setTimeout(()=>{o.anim=false;place(o,o.tg.xy,o.tg.z);if(to===56)SFX.home()},120)}},190)}
function update(){
 const me=S.players.find(p=>p.id===you);if(!me)return;
 const cur=S.ph==='play'?S.players[S.turn]:null,mine=!!cur&&cur.id===you,rolled=S.dice!==null,lob=S.ph==='lobby';
 $('pbar').innerHTML=S.players.map(p=>`<div class="pc${cur===p?' on':''}${p.done?' dn':''}${ON.includes(p.id)?'':' off'}" style="--c:${COL[p.seat]}"><div class="av"><span>${AV[p.seat]}</span></div><div class="nm"></div><span class="rk">${p.done?MED[S.rank.indexOf(p.seat)]:'&nbsp;'}</span></div>`).join('');
 [...document.querySelectorAll('.pc .nm')].forEach((e,k)=>e.textContent=S.players[k].name+(S.players[k].id===you?' (you)':ON.includes(S.players[k].id)?'':' (auto)'));
 for(let k=0;k<4;k++)$('yh'+k).classList.toggle('on',!!cur&&cur.seat===k);
 if(!built){built=true;for(let s=0;s<4;s++)for(let i=0;i<4;i++){const el=document.createElement('div');el.className='pw';el.dataset.i=i;el.style.setProperty('--c',COL[s]);
  el.innerHTML='<div class="in"><div class="sh"></div><div class="bd"></div><div class="hd"></div></div>';el.hidden=true;$('bd').appendChild(el);pawns[s+'-'+i]={el,q:null,anim:false}}}
 const mv=mine&&rolled?legal(me.seat,S.dice):[],items=[];
 S.players.forEach(p=>S.tk[p.seat].forEach((q,i)=>items.push({s:p.seat,i,q,xy:pos(p.seat,q,i)})));
 const g={};items.forEach(t=>(g[t.xy]=g[t.xy]||[]).push(t));
 Object.values(g).forEach(a=>{if(a.length>1)a.forEach((t,j)=>{t.xy=[t.xy[0]+(j%2?.2:-.2),t.xy[1]+(j>1?.2:-.2)]})});
 let capd=false;
 items.forEach(t=>{const o=pawns[t.s+'-'+t.i],el=o.el,prev=o.q;el.hidden=false;t.z=Math.round(t.xy[1]*2);o.tg=t;o.q=t.q;
  el.classList.toggle('mv',t.s===me.seat&&mv.includes(t.i));
  if(o.anim)return;
  if(prev===null||prev===t.q){place(o,t.xy,t.z);return}
  if(t.q===-1)capd=true;if(prev<0&&t.q===0)SFX.out();
  moveTo(o,t.s,t.i,prev,t.q)});
 if(capd){SFX.cap();vib([80,40,80])}
 // lobby / controls
 $('lob').hidden=!lob;$('ctl').hidden=lob;
 if(lob){const host=S.players[0].id===you;
  $('lob').innerHTML=`<div>You are <b style="color:${COL[me.seat]}">${CN[me.seat]}</b> · ${S.players.length}/4 players</div>
  <div class="row" style="margin:8px 0"><button class="alt grow${S.mode==='classic'?' on':''}" data-m="classic" ${host?'':'disabled'}>Classic</button><button class="alt grow${S.mode==='quick'?' on':''}" data-m="quick" ${host?'':'disabled'}>Quick</button></div>
  <div class="mut">${S.mode==='classic'?'Bring all 4 pawns home. Play on until one player is left.':'First pawn home finishes your game.'}<br>Roll 6 to open a pawn · 6, capture or pawn home = roll again · three 6s in a row lose the turn · ★ squares are safe · ${TURN/1000}s per turn, then auto-play.</div>
  ${host?`<button id="go" class="go" style="width:100%;margin-top:10px" ${S.players.length<2?'disabled':''}>${S.players.length<2?'Waiting for friends…':'Start game'}</button>`:'<div class="mut" style="margin-top:8px">Waiting for the host to start…</div>'}`;
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>send({t:'mode',m:b.dataset.m}));if($('go'))$('go').onclick=()=>send({t:'start'})}
 else{$('ms').textContent=S.msg;
  $('sub').textContent=S.ph==='done'?'Game over':mine?(rolled?'Tap a glowing pawn':'Your turn – tap the dice'):'Waiting for '+(cur?cur.name:'')+'…';
  $('rl').disabled=!(mine&&!rolled);$('dw').classList.toggle('my',mine&&!rolled&&S.ph==='play')}
 if(rolled&&S.n!==lastRoll){lastRoll=S.n;const[ax,ay]=ROT[S.dice-1];rot++;
  $('cube').style.transform=`rotateX(${ax+720*rot}deg) rotateY(${ay+720*rot}deg)`;
  $('dw').classList.remove('rl');void $('dw').offsetWidth;$('dw').classList.add('rl');SFX.roll();if(S.dice===6)setTimeout(SFX.six,950)}
 const key=S.turn+':'+S.n+':'+rolled;if(key!==lastKey){lastKey=key;if(mine&&!rolled&&S.ph==='play'){setTimeout(SFX.ping,300);vib(60)}}
 if(S.ph==='done'&&!doneShown){doneShown=true;setTimeout(showResults,1400)}
 if(S.ph!=='done'){doneShown=false;$('ov').hidden=true}
}
function showResults(){
 if(!S||S.ph!=='done')return;const host=S.players[0].id===you;
 $('ov').innerHTML=`<div class="card"><h2 style="margin:0 0 8px">🏆 Final ranking</h2>${S.rank.map((seat,k)=>`<div class="rankrow" style="--c:${COL[seat]}"><span>${MED[k]}</span><span class="rn"></span></div>`).join('')}
  ${host?'<button id="ag" class="go" style="width:100%;margin-top:8px">Play again</button>':'<div class="mut">Waiting for the host to play again…</div>'}</div>`;
 [...$('ov').querySelectorAll('.rn')].forEach((e,k)=>{const p=S.players.find(p=>p.seat===S.rank[k]);e.textContent=AV[S.rank[k]]+' '+(p?p.name:'')});
 $('ov').hidden=false;if($('ag'))$('ag').onclick=()=>send({t:'again'});SFX.win();vib([100,50,100,50,200]);
 for(let k=0;k<50;k++){const c=document.createElement('i');c.className='cf';c.style.left=Math.random()*100+'vw';c.style.background=COL[k%4];c.style.animationDuration=2+Math.random()*2.5+'s';c.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),5500)}}

// ---------- chat ----------
function addMsg(d){const el=document.createElement('div'),own=mineSeat(d.seat);
 el.className='m'+(own?' me':'')+(/^(\p{Extended_Pictographic}\uFE0F?\s*){1,3}$/u.test(d.text)?' big':'');el.style.setProperty('--c',COL[d.seat]);
 const b=document.createElement('b');b.textContent=own?'You':d.name;el.append(b,d.text);
 const l=$('log');l.appendChild(el);while(l.children.length>60)l.firstChild.remove();l.scrollTop=l.scrollHeight;$('typ').textContent=''}
function floatEmoji(d){const f=document.createElement('div');f.className='fl';f.style.left=10+Math.random()*70+'%';f.textContent=d.e;
 const s=document.createElement('small');s.textContent=d.name;f.appendChild(s);$('fx').appendChild(f);setTimeout(()=>f.remove(),2500)}
function typing(d){const t=$('typ');if(!t)return;t.innerHTML='<span class="dots"><i></i><i></i><i></i></span> ';t.append(d.name+' is typing');clearTimeout(typT);typT=setTimeout(()=>t.textContent='',2500)}

// ---------- turn timer ring ----------
setInterval(()=>{if(!S||S.ph!=='play'||!S.dl)return;const left=Math.max(0,S.dl-(Date.now()+off)),el=document.querySelector('.pc.on .av');
 if(el){el.style.setProperty('--p',left/TURN*360+'deg');el.dataset.t=Math.ceil(left/1000)}
 const sec=Math.ceil(left/1000);if(S.players[S.turn].id===you&&sec<=5&&sec>0&&sec!==lastTick){lastTick=sec;SFX.tick()}},250);
home();
</script></body></html>
